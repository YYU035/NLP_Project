name: Software and artifact validation

on:
  push:
    branches: [main, codex/main-consolidation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
      MPLCONFIGDIR: ${{ github.workspace }}/.cache/matplotlib
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/*.lock
      - name: Install pinned software without model weights
        run: |
          python -m pip install -r requirements/runtime.lock -r requirements/interpretability.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Check dependencies
        run: python -m pip check
      - name: Run software tests
        run: |
          mkdir -p .cache
          python -m pytest tests -q --basetemp .cache/pytest_tmp
      - name: Verify frozen artifact integrity
        run: python scripts/check_integrity.py
